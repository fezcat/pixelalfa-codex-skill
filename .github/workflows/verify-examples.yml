name: Verify RGBA examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Check active.png and cancelled.png
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Verify both cleanup examples
        run: python scripts/verify_examples.py
      - name: Verify detection and protected contours
        run: python tests/verify_detection.py
